name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ios/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ios/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          PORT: '3000'
          ALLOWED_ORIGINS: 'http://localhost:3000'
          SUPABASE_URL: 'http://localhost:54321'
          SUPABASE_ANON_KEY: 'test-anon-key'
          SUPABASE_SERVICE_ROLE_KEY: 'test-service-role-key'

  ios:
    name: iOS Build
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/AppTemplate

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install iOS Simulator runtime
        run: |
          # Xcode 16.2 on macos-15 runners doesn't bundle the iOS runtime —
          # download it so simulators become usable for build & test.
          xcodebuild -downloadPlatform iOS

      - name: Boot simulator
        run: |
          # Pick the first available iPhone simulator now that the runtime is installed
          SIM_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import sys,json; devs=json.load(sys.stdin)["devices"];
          [print(d["udid"]) or sys.exit(0) for r,ds in devs.items() if "iOS" in r for d in ds if "iPhone" in d["name"]]
          sys.exit(1)')
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_ID" 2>/dev/null || true

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project AppTemplate.xcodeproj -scheme AppTemplate

      - name: Build (Debug, Simulator)
        run: |
          xcodebuild build \
            -project AppTemplate.xcodeproj \
            -scheme AppTemplate \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Run tests
        run: |
          xcodebuild test \
            -project AppTemplate.xcodeproj \
            -scheme AppTemplate \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
